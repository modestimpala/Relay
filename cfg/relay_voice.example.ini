# RelayCpp Voice API 3 settings. Copy to shimloader/cfg/relay_voice.ini.
# Capture stays closed by default. Enumeration and preference changes never open hardware.
allow_capture=0
# Managed by Relay_VoiceSetPreferredDevice; empty follows the system default.
device_id=
mic_gain=1.0
master_volume=1.0
bitrate=24000

# Set to 440 for the V-b synthetic loopback test. A non-zero tone uses no
# microphone and does not require allow_capture=1.
test_tone_hz=0
